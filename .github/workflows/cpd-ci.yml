name: CPD CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cpd-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: CPD checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0; reads packageManager
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and type-check
        run: pnpm run build
      - name: Check telemetry and desktop packaging regressions
        run: |
          pnpm run test \
            packages/bundle/base/tests/base.spec.ts \
            packages/bundle/sdk-minimal/tests/sdk-minimal.spec.ts \
            packages/bundle/web-app/tests/no-product-telemetry.spec.ts \
            apps/desktop/tests/desktop-package-environment.spec.ts \
            apps/desktop/tests/macos-signature.spec.ts \
            apps/desktop/tests/package-target.spec.ts

  desktop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'clayton-duarte/cpd-dsh'
    needs: checks
    uses: ./.github/workflows/cpd-desktop-preview.yml

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'clayton-duarte/cpd-dsh'
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.desktop.outputs.artifact-name }}
          path: release-assets
      - name: Publish commit-tagged unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-assets
        run: |
          shopt -s nullglob
          images=(cpd-*-mac-arm64-unsigned.dmg)
          test "${#images[@]}" -eq 1
          dmg="${images[0]}"
          test "$(sha256sum -- "$dmg")" = "$(cat "$dmg.sha256")"
          tag="cpd-desktop-$GITHUB_SHA"
          # A rerun must not replace assets from an existing release.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" "$dmg" "$dmg.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CPD Desktop preview (${GITHUB_SHA:0:12})" \
            --prerelease --latest=false \
            --notes "Unsigned, not notarized macOS arm64 DMG. Built from $GITHUB_SHA after CPD checks passed. This is a preview, not a production release."
